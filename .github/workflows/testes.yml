# Rubrica de Exigência - Testes automatizados
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos e build
        run: npm run build

      - name: Testes de unidade e das telas
        run: npm test

      - name: Imagem Docker
        run: docker build -t hangdle-frontend .
