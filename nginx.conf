# O nginx do container do front só entrega o build (dist/).
# Quem leva /api/ para o back é o nginx do hangdle-backend, na frente deste.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # As rotas do React (/salas, /listas/1/palavras...) não são arquivos:
  # voltam para o index.html, e o React Router abre a tela certa.
  location / {
    try_files $uri /index.html;
  }
}
