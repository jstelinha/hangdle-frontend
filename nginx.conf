# O nginx do container do front só entrega o build (dist/).
# Quem leva /api/ para o back é o nginx do hangdle-backend, na frente deste.

# Não diz a versão do nginx no cabeçalho Server nem nas páginas de erro.
server_tokens off;

# Comprime o JS, o CSS e o SVG: o JS cai de 855 kB para cerca de 255 kB.
# O nginx da frente fala HTTP/1.0 com este, por isso o gzip_http_version 1.0.
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_http_version 1.0;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Os arquivos de /assets/ têm um hash no nome, que muda a cada build: podem ficar um ano no cache.
  # O que não existe aqui é 404, e não o index.html, para o navegador não tentar rodar HTML como JS.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # As rotas do React (/salas, /listas/1/palavras...) não são arquivos:
  # voltam para o index.html, e o React Router abre a tela certa.
  # O index.html é conferido a cada visita, para ninguém ficar com um que aponta para assets de um build antigo.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
